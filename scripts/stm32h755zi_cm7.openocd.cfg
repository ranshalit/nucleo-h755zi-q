source [find interface/stlink-dap.cfg]
set AP_NUM 0
set DUAL_CORE 1
source [find target/stm32h7x.cfg]
# Right after STM32CubeProgrammer flashes and starts the app, the CM7 cannot be
# examined by a hot-plug connect; connecting under NRST (JP3 T_NRST) works.
if {[info exists CONNECT_UNDER_RESET] && $CONNECT_UNDER_RESET} {
    reset_config srst_only srst_nogate connect_assert_srst
}
init
targets stm32h7x.cm7
