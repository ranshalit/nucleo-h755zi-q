# USB Audio Class 2 loopback demo.
#
# Modern experimental USB device stack + UDC DWC2 driver, needed because the
# legacy USB_DEVICE_STACK's usb_dc_stm32.c never recovers from DWC2's
# "incomplete isochronous OUT" condition on this board (docs/usb_debug.md,
# Step 44).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y

# UAC2 relies on SOF-driven scheduling (usbd_uac2.c's uac2_sof() re-arms every
# isochronous OUT read once per SOF); without this the OUT endpoint is only
# ever armed once at interface-enable time and receives exactly one packet.
CONFIG_UDC_ENABLE_SOF=y

CONFIG_SAMPLE_USBD_MANUFACTURER="Zephyr STM32H7 Playground"
CONFIG_SAMPLE_USBD_PRODUCT="UAC2 Loopback"
CONFIG_SAMPLE_USBD_PID=0x0101
CONFIG_SAMPLE_USBD_SELF_POWERED=y

CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USBD_LOG_LEVEL_DBG=y

CONFIG_MAIN_STACK_SIZE=2048
