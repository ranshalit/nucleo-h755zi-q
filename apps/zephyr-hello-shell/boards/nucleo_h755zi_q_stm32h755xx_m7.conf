CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SPEED_OPTIMIZATIONS=y
# Without this, soc_early_init_hook's sys_cache_*_enable() are no-ops and the
# M7 runs with I/D cache off (speech inference was ~10x slower).
CONFIG_CACHE_MANAGEMENT=y
CONFIG_SOC_PREP_HOOK=y
# Configure fine-grained kernel timekeeping for zyclictest latency measurement.
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
CONFIG_ZYCLICTEST_SHELL=y
# User-mode MPU permissions isolate the LED blink threads.
CONFIG_USERSPACE=y
# The application creates 17 threads; three permission bytes cover up to 24.
CONFIG_MAX_THREAD_BYTES=3
# Also protect stacks of supervisor-mode threads.
CONFIG_HW_STACK_PROTECTION=y
# The M7 image may extend into bank 2 sector 0; sector 1 stores speech data.
CONFIG_FLASH_LOAD_SIZE=0x00120000
# MCU die temperature sensor (st,stm32-temp-cal on ADC3) for the dashboard.
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_INFO=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SPI=y
CONFIG_SPI_SHELL=y
CONFIG_APP_USB_HOST_HCD=y
CONFIG_APP_SPEECH_AI=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
# The CM4 is unused; M7 owns both flash banks and never starts the CM4.
CONFIG_STM32H7_BOOT_M4_AT_INIT=n

CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_TRACING_PACKET_MAX_SIZE=64
CONFIG_RAM_TRACING_BUFFER_SIZE=16384
