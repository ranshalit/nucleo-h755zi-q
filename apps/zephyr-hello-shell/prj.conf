CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=9
CONFIG_KERNEL_SHELL=y
CONFIG_JSON_LIBRARY=y
# MCU die temperature (st,stm32-temp-cal on ADC3) for the dashboard.
CONFIG_ADC=y
CONFIG_SENSOR=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_ARP=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.55.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.55.100"
# Don't block boot (main) waiting for PHY autonegotiation; the static
# address is still assigned immediately and the link comes up in background.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_SHELL=y
# The camera stream sends to one client at a time on a blocking socket.
# If a client disconnects uncleanly (no FIN/RST reaches the board, e.g.
# TCP window closes because the client just stops reading), a plain
# blocking send() can wait forever, wedging the single stream thread
# and holding onto its buffered/in-flight frame data indefinitely. That
# starves the shared network buffer pool the port-80 dashboard thread
# also needs. Enable per-socket send/receive timeouts so camera_stream.c
# can bound how long it waits on a stuck client and recover.
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
# Zephyr's global file-descriptor table (ZVFS_OPEN_MAX) defaults to only
# 4 slots, shared by every socket in the whole system. The dashboard
# alone already needs 4 (1 listener + CONFIG_HTTP_SERVER_MAX_CLIENTS=3),
# so the camera stream's 2 additional sockets (1 listener + 1 serving
# client) exhausted the pool and silently starved the dashboard of a
# free fd to accept new connections on. Size both the fd table and the
# poll() entry table generously so the two services can never starve
# each other.
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=8
CONFIG_SHELL_STACK_SIZE=3072

CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_NUM_SERVICES=1
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_HTTP_SERVER_MAX_STREAMS=1
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=256
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=1
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=64
CONFIG_HTTP_SERVER_MAX_CONTENT_TYPE_LENGTH=64
